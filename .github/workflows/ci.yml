name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"   # adjust if needed

    - name: Set up uv
      uses: astral-sh/setup-uv@v3

    - name: Install dependencies with uv
      run: |
        uv sync --dev

    - name: Run tests
      run: |
        uv run pytest -q tests/test_data_format.py
